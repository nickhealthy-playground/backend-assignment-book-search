external:
  naver:
    url: ${NAVER_API_URL:http://localhost:9090}
    headers:
      client-id: ${NAVER_API_CLIENT_ID:mock-client-id}
      client-secret: ${NAVER_API_CLIENT_SECRET:mock-client-secret}
  kakao:
    url: https://dapi.kakao.com
    headers:
      rest-api-key: test
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 100
        minimum-number-of-calls: 10
        wait-duration-in-open-state:
          seconds: 20
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 10